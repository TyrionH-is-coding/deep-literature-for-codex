name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workbench:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, ubuntu-24.04-arm, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Workbench unit tests
        run: |
          npm ci --ignore-scripts
          npm run check:modules
          npm test

  oauth:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, ubuntu-24.04-arm, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: OAuth unit tests
        working-directory: oauth
        run: |
          npm ci
          npm test
      - name: Real native OAuth startup with a fresh unauthenticated home
        working-directory: oauth
        run: npm run test:live-unauthed
