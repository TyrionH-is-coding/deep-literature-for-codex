name: Platform installation

on:
  workflow_dispatch:
  push:
    branches: [main, codex/cross-platform-support]

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, ubuntu-24.04-arm, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch the pinned engine release
        shell: bash
        run: |
          npm ci --ignore-scripts
          node scripts/fetch-engine.mjs
      - name: Prepare Linux desktop credential service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - name: Install and accept on Linux with a real Secret Service
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c 'printf "%s" "synthetic-ci-password" | gnome-keyring-daemon --unlock --components=secrets; node scripts/acceptance-package.mjs'
      - name: Prepare a temporary macOS keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p synthetic-ci-password "$RUNNER_TEMP/deep-literature.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/deep-literature.keychain-db"
          security unlock-keychain -p synthetic-ci-password "$RUNNER_TEMP/deep-literature.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/deep-literature.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/deep-literature.keychain-db"
      - name: Install and accept on Windows or macOS
        if: runner.os != 'Linux'
        run: node scripts/acceptance-package.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-install-${{ matrix.os }}
          path: outputs/platform-*
